<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask your database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Ask your database</h1>
        <p>
          Type a question in plain English. It gets turned into SQL, run against
          Postgres, and answered back in plain English.
        </p>
      </header>

      <main class="chat" id="chat">
        <div class="msg msg--bot">
          <div class="bubble">
            Ask me something about your data — for example, "how many orders
            came in last week" or "who are the top 5 customers by spend".
          </div>
        </div>
      </main>

      <form class="composer" id="composer">
        <textarea
          id="input"
          placeholder="Ask a question about your data…"
          rows="1"
          autofocus
        ></textarea>
        <button type="submit" id="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 12L20 4L14 20L11 13L4 12Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
